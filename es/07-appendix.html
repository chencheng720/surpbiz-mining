<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surpbiz Limited — Servicio y Anexo · v3.0</title>
<meta name="description" content="">
<style>
:root{
  /* 底色：暖白与浅灰交替 */
  --bg:#FBFAF7;--bg-alt:#F4F2EC;--bg-card:#FFFFFF;--bg-dark:#15161A;--bg-deep:#0E0F12;
  /* 墨色 */
  --ink:#1A1A1A;--ink-soft:#53534D;--ink-faint:#87877F;
  /* 主色：品牌红（取自 logo） */
  --accent:#E1251B;--accent-dark:#9E150E;--accent-light:#FF6A5E;--accent-wash:#FDF1F0;
  /* 辅色一：深钢蓝 —— 用于技术/参数区块 */
  --steel:#1F4E5F;--steel-light:#2E6B80;--steel-wash:#EDF4F6;
  /* 辅色二：赭铜 —— 用于警示/储运区块 */
  --copper:#A8672B;--copper-light:#C98245;--copper-wash:#FBF3EA;
  /* 中性金：用于分隔与标注 */
  --brass:#A98A42;--brass-wash:#F7F2E6;
  /* 线条 */
  --line:#E4E1D8;--line-soft:#F0EDE4;
  --serif:Georgia,'Times New Roman',serif;
  --sans:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono','Cascadia Mono',Consolas,monospace;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.05);
  --shadow-lg:0 2px 8px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.10);
  /* 章节主题色（每章切换强调色） */
  --ch: var(--accent); --ch-wash: var(--accent-wash);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.68;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}

/* ===== NAV ===== */
.nav{position:sticky;top:0;z-index:300;background:rgba(250,250,247,.94);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--line);padding:0 1.6rem;height:60px;display:flex;align-items:center;gap:1.1rem}
.nav-logo{height:26px;width:auto;flex-shrink:0}
.nav-links{display:flex;gap:.1rem;overflow-x:auto;scrollbar-width:none;flex:1}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-size:.735rem;color:var(--ink-soft);text-decoration:none;padding:.34rem .55rem;border-radius:4px;white-space:nowrap;font-weight:500;transition:all .18s;letter-spacing:.01em}
.nav-links a:hover{color:var(--accent);background:var(--accent-wash)}
.nav-links a.on{color:#fff;background:var(--accent);font-weight:600}
.nav-links a.home{font-weight:700;color:var(--accent)}
.nav-cta{font-size:.72rem;font-weight:600;color:#fff;background:var(--accent);padding:.42rem .9rem;border-radius:4px;text-decoration:none;white-space:nowrap;transition:background .18s;letter-spacing:.02em}
.nav-cta:hover{background:var(--accent-dark)}
.nav-ver{font-family:var(--mono);font-size:.63rem;color:var(--ink-faint);letter-spacing:.05em;padding:.3rem .5rem;border:1px solid var(--line);border-radius:3px;white-space:nowrap;background:var(--bg-card)}
@media(max-width:860px){.nav{height:54px;padding:0 1rem}.nav-links a{font-size:.7rem;padding:.3rem .42rem}}

/* 页面切换条：多页架构下提示"当前在单页中，选章节请回目录" */
.pagenav{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;max-width:1160px;margin:0 auto;padding:1.6rem 1.6rem 0}
.pagenav-l,.pagenav-r{font-size:.8rem;color:var(--ink-faint)}
.pagenav-r{text-align:right}
.pagenav a{color:var(--steel);text-decoration:none;font-weight:600;transition:color .18s}
.pagenav a:hover{color:var(--accent)}
.pagenav-mid{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);text-align:center;white-space:nowrap}
.pagenav-l a,.pagenav-r a{display:inline-block;padding:.4rem .1rem}
@media(max-width:640px){.pagenav{grid-template-columns:1fr;text-align:center;padding-top:1.2rem}.pagenav-r{text-align:center}}

/* ===== COVER ===== */
.cover{position:relative;min-height:88vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;overflow:hidden;padding:5rem 1.5rem 4rem}
.cover-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,14,.62) 0%,rgba(12,12,14,.55) 40%,rgba(12,12,14,.88) 100%);z-index:1}
.cover-in{position:relative;z-index:2;max-width:860px;width:100%}
.cover-logo{height:44px;width:auto;margin:0 auto 2.4rem;background:rgba(255,255,255,.94);padding:9px 20px;border-radius:5px;box-shadow:0 3px 22px rgba(0,0,0,.3)}
.cover-eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600;margin-bottom:1.1rem}
.cover h1{font-family:var(--serif);font-size:clamp(2.6rem,7vw,4.9rem);font-weight:300;letter-spacing:-.022em;line-height:1.03;color:#fff;margin-bottom:1.1rem;text-shadow:0 2px 26px rgba(0,0,0,.4)}
.cover-rule{width:52px;height:2px;background:var(--accent);margin:1.5rem auto}
.cover-sub{font-size:clamp(.95rem,2vw,1.12rem);color:rgba(255,255,255,.85);line-height:1.6;max-width:660px;margin:0 auto 2.6rem;font-weight:300}
.cover-meta{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.cover-tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.3);padding:.42rem .9rem;border-radius:3px;background:rgba(255,255,255,.07)}
.cover-ver{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;color:rgba(255,255,255,.6);margin-top:1.6rem;text-transform:uppercase}

/* 内页精简头 */
.pagehead{background:linear-gradient(135deg,#15161A 0%,#1E252D 100%);color:#fff;padding:2.6rem 1.6rem 2.4rem;position:relative;overflow:hidden}
.pagehead::after{content:'';position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(225,37,27,.16) 0%,transparent 70%)}
.pagehead-in{max-width:1160px;margin:0 auto;position:relative;z-index:1}
.pagehead-eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-light);font-weight:600;margin-bottom:.7rem}
.pagehead-t{font-family:var(--serif);font-size:clamp(1.7rem,4vw,2.6rem);font-weight:400;letter-spacing:-.018em;line-height:1.14;margin-bottom:.6rem}
.pagehead-s{font-size:.95rem;color:rgba(255,255,255,.68);line-height:1.6;max-width:760px}

/* ===== SECTION SHELL ===== */
.sec{padding:5.2rem 1.6rem 4.2rem;max-width:1160px;margin:0 auto}
.sec-alt{background:var(--bg-alt)}
.sec-head{margin-bottom:3rem;max-width:840px}
.sec-eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:.85rem}
.sec-num{font-family:var(--serif);font-size:3.4rem;font-weight:300;color:var(--steel);opacity:.24;line-height:1;margin-bottom:-.6rem}
h2.sec-title{font-family:var(--serif);font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:400;letter-spacing:-.018em;line-height:1.16;margin-bottom:1.1rem}
.sec-lead{font-size:1.03rem;color:var(--ink-soft);line-height:1.75;max-width:800px}
h3{font-size:1.16rem;font-weight:600;line-height:1.34;margin-bottom:.5rem}
h4{font-size:.98rem;font-weight:600;margin-bottom:.42rem}
p{margin-bottom:.85rem}

/* ===== NOTICE BAR ===== */
.notice{display:flex;gap:.85rem;align-items:flex-start;background:var(--steel-wash);border-left:3px solid var(--steel);padding:1.05rem 1.25rem;border-radius:0 6px 6px 0;margin:1.8rem 0;font-size:.875rem;color:#173A46;line-height:1.6}
.notice b{color:var(--steel)}
.notice-ico svg{stroke:var(--steel)}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:2.6rem 0}
.stat{background:var(--bg-card);padding:1.5rem 1.2rem;text-align:center;position:relative;transition:background .2s}
.stat:hover{background:var(--accent-wash)}
.stat::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.stat:nth-child(2)::before{background:var(--steel)}
.stat:nth-child(3)::before{background:var(--copper)}
.stat:nth-child(4)::before{background:var(--brass)}
.stat-n{font-family:var(--serif);font-size:2.1rem;font-weight:400;color:var(--accent);line-height:1;margin-bottom:.4rem}
.stat:nth-child(2) .stat-n{color:var(--steel)}
.stat:nth-child(3) .stat-n{color:var(--copper)}
.stat:nth-child(4) .stat-n{color:var(--brass)}
.stat-l{font-size:.755rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;font-weight:600}

/* ===== ADVANTAGE / FEATURE CARDS ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:1.35rem;margin:2.4rem 0}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:8px;padding:1.6rem 1.5rem;transition:all .22s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .28s}
.card:nth-child(4n+2)::before{background:var(--steel)}
.card:nth-child(4n+3)::before{background:var(--copper)}
.card:nth-child(4n+4)::before{background:var(--brass)}
.card:hover{box-shadow:var(--shadow);border-color:transparent;transform:translateY(-2px)}
.card:hover::before{transform:scaleY(1)}
.card-ico{width:34px;height:34px;border-radius:6px;background:var(--accent-wash);display:flex;align-items:center;justify-content:center;margin-bottom:1rem}
.card-ico svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card:nth-child(2) .card-ico{background:var(--steel-wash)}
.card:nth-child(2) .card-ico svg{stroke:var(--steel)}
.card:nth-child(3) .card-ico{background:var(--copper-wash)}
.card:nth-child(3) .card-ico svg{stroke:var(--copper)}
.card:nth-child(4) .card-ico{background:var(--brass-wash)}
.card:nth-child(4) .card-ico svg{stroke:var(--brass)}
.notice-ico,.sn-ico,.tblock-ico{width:auto;height:auto;background:none;margin:0;flex-shrink:0}
.notice-ico svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sn-ico svg{width:17px;height:17px;stroke:var(--accent-light);fill:none;stroke-width:1.7}
.tblock-ico svg{width:14px;height:14px;stroke:var(--copper);fill:none;stroke-width:1.8}
.card p{font-size:.885rem;color:var(--ink-soft);line-height:1.66;margin:0}
.card-n{font-family:var(--mono);font-size:.66rem;color:var(--accent);font-weight:700;letter-spacing:.1em;margin-bottom:.6rem;display:block}

/* ===== PRODUCT BLOCK ===== */
.prod{padding:3.4rem 0;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:none;padding-top:1.5rem}
.prod-head{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:start;margin-bottom:1.5rem}
.prod-name{font-family:var(--serif);font-size:clamp(1.32rem,2.6vw,1.72rem);font-weight:400;letter-spacing:-.012em;line-height:1.2;margin-bottom:.9rem;display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;padding-bottom:.6rem;position:relative}
.prod-name::after{content:'';position:absolute;left:0;bottom:0;width:56px;height:2px;background:linear-gradient(90deg,var(--accent) 0%,var(--brass) 100%)}
.prod-full{font-size:.83rem;color:var(--ink-faint);font-weight:400;font-style:italic}
.prod-formula{font-family:var(--mono);font-size:.8rem;color:var(--ink-soft);background:var(--bg-alt);padding:.18rem .5rem;border-radius:3px;letter-spacing:.02em}
.prod-tag{font-size:.9rem;color:var(--ink-soft);line-height:1.66;max-width:720px;margin-bottom:.9rem}
.badges{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.badge{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.26rem .55rem;border-radius:3px;border:1px solid}
.badge-new{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge-flag{background:transparent;color:var(--copper);border-color:var(--copper)}
.badge-seq{background:var(--bg-alt);color:var(--ink-soft);border-color:var(--line)}

/* flag */
.prod-flags{margin-top:2.2rem;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.flag-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line)}
.flag{background:var(--bg-card);padding:1.1rem 1.15rem}
.flag-row .flag{border-top:2px solid var(--steel)}
.flag-row .flag:nth-child(4n+2){border-top-color:var(--copper)}
.flag-row .flag:nth-child(4n+3){border-top-color:var(--brass)}
.flag-row .flag:nth-child(4n+4){border-top-color:var(--accent)}
.flag-k{font-size:.7rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.085em;font-weight:600;margin-bottom:.34rem;line-height:1.35}
.flag-v{font-family:var(--mono);font-size:1.02rem;font-weight:600;color:var(--ink);line-height:1.25;letter-spacing:-.01em}
.flag-u{font-size:.74rem;color:var(--ink-faint);font-weight:400;margin-left:.16rem;font-family:var(--sans)}
.flag-n{font-size:.7rem;color:var(--steel);margin-top:.26rem;line-height:1.4}

/* media + text */
.prod-media{margin:1.7rem 0;border-radius:8px;overflow:hidden;background:var(--bg-alt);border:1px solid var(--line);max-width:560px}
.prod-media img{width:100%;height:auto;display:block}
.prod-media figcaption{background:var(--bg-card)}
.prod-media-cap{font-size:.75rem;color:var(--ink-faint);padding:.6rem .95rem;background:var(--bg-card);border-top:1px solid var(--line);line-height:1.5}

/* spec table */
.tbl-wrap{overflow-x:auto;margin:1.15rem 0;border:1px solid var(--line);border-radius:7px;background:var(--bg-card);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.855rem;min-width:440px}
thead th{background:var(--steel);color:#fff;font-weight:600;font-size:.715rem;text-transform:uppercase;letter-spacing:.09em;padding:.72rem .95rem;text-align:left;white-space:nowrap}
thead tr:nth-child(even) th{background:var(--steel-light)}
tbody td{padding:.66rem .95rem;border-top:1px solid var(--line-soft);vertical-align:top;line-height:1.55}
tbody tr:nth-child(even){background:rgba(0,0,0,.014)}
td.k{font-weight:600;color:var(--ink);width:40%;min-width:170px}
td.v{font-family:var(--mono);font-size:.82rem;color:var(--ink);width:34%;letter-spacing:-.005em}
td.v.txt{font-family:var(--sans);font-size:.845rem}
td.n{font-size:.78rem;color:var(--ink-faint);line-height:1.5}
.tnote{font-size:.775rem;color:var(--ink-faint);font-style:italic;margin-top:.6rem;line-height:1.55;padding-left:.1rem}

/* feature list */
.flist{list-style:none;margin:1.2rem 0;display:flex;flex-direction:column;gap:.62rem}
.flist li{position:relative;padding-left:1.55rem;font-size:.885rem;color:var(--ink-soft);line-height:1.62}
.flist li::before{content:'';position:absolute;left:0;top:.52em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* transport block */
.tblock{background:var(--copper-wash);border-left:3px solid var(--copper);border-radius:0 7px 7px 0;padding:1.15rem 1.3rem;margin:1.3rem 0}
.tblock-h{font-size:.715rem;text-transform:uppercase;letter-spacing:.11em;font-weight:700;color:var(--copper);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.tblock-h svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.8}
.tblock ul{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.tblock li{position:relative;padding-left:1.15rem;font-size:.85rem;color:var(--ink-soft);line-height:1.6}
.tblock li::before{content:'▪';position:absolute;left:0;color:var(--copper);font-size:.7rem;top:.1em}

/* un badge */
.unbar{display:inline-flex;gap:.5rem;align-items:center;background:var(--bg-dark);color:#fff;padding:.42rem .8rem;border-radius:4px;font-family:var(--mono);font-size:.735rem;letter-spacing:.03em;margin-top:.9rem;border-left:2px solid var(--accent)}
.unbar b{color:var(--accent-light);font-weight:600}

/* sub-block */
.sblock{margin:2rem 0;padding:1.4rem 1.5rem;background:var(--bg-card);border:1px solid var(--line);border-radius:7px}
.sblock{background:var(--bg-card);border:1px solid var(--line);border-radius:7px;border-top:2px solid var(--steel)}
.sblock-h{font-size:.775rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--steel);margin-bottom:1rem}
.sblock p{font-size:.885rem;color:var(--ink-soft);line-height:1.68;margin:0}

/* series note */
.series-note{background:linear-gradient(100deg,var(--steel) 0%,var(--steel-light) 100%);color:#fff;border-radius:8px;padding:1.3rem 1.5rem;margin:1.8rem 0;display:flex;gap:.9rem;align-items:flex-start}
.series-note svg{width:17px;height:17px;stroke:var(--accent-light);fill:none;stroke-width:1.7;flex-shrink:0;margin-top:.16rem}
.series-note p{font-size:.875rem;color:rgba(255,255,255,.82);line-height:1.62;margin:0}

/* 产品图集 */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:1.5rem 0}
.gal-i{width:100%;height:132px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* 上下产品导航 */
.relnav{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2.6rem;padding-top:1.6rem;border-top:1px solid var(--line)}
.rel{display:block;text-decoration:none;padding:.85rem 1rem;border:1px solid var(--line);border-radius:7px;background:var(--bg-card);transition:all .2s}
.rel:hover{border-color:var(--steel);background:var(--steel-wash)}
.rel-next{text-align:right}
.rel-l{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint);font-weight:700;margin-bottom:.28rem}
.rel-t{display:block;font-size:.9rem;font-weight:600;color:var(--steel);line-height:1.32}
@media(max-width:640px){.relnav{grid-template-columns:1fr}.rel-next{text-align:left}}

/* ===== OVERVIEW MATRIX ===== */
.matrix{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:2rem 0}
.mcell{background:var(--bg-card);padding:1.4rem 1.3rem;transition:background .2s}
.mcell:hover{background:var(--steel-wash)}
.mcell-n{font-family:var(--mono);font-size:.65rem;color:var(--steel);font-weight:700;letter-spacing:.11em;margin-bottom:.55rem}
.mcell-t{font-size:.97rem;font-weight:600;margin-bottom:.4rem;line-height:1.32}
.mcell-d{font-size:.815rem;color:var(--ink-soft);line-height:1.56}

/* 主页章节卡 */
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:1.3rem;margin:2.4rem 0}
.chcard{display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg-card);transition:all .24s}
.chcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);border-color:var(--steel)}
.chcard-img{width:100%;height:172px;overflow:hidden;background:var(--bg-alt);border-bottom:1px solid var(--line)}
.chcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .45s}
.chcard:hover .chcard-img img{transform:scale(1.05)}
.chcard-b{padding:1.1rem 1.2rem 1.25rem;flex:1;display:flex;flex-direction:column}
.chcard-n{font-family:var(--mono);font-size:.64rem;color:var(--steel);font-weight:700;letter-spacing:.12em;margin-bottom:.45rem}
.chcard-t{font-size:1.02rem;font-weight:600;line-height:1.32;margin-bottom:.4rem}
.chcard-d{font-size:.79rem;color:var(--ink-soft);line-height:1.55;margin-bottom:.9rem;flex:1}
.chcard-go{font-size:.775rem;color:var(--accent);font-weight:600}

/* 章节页跨章导航 */
.xnavwrap{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:1160px;margin:0 auto;padding:0 1.6rem 4rem}
.xnav{display:block;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:1.05rem 1.2rem;background:var(--bg-card);transition:all .2s}
.xnav:hover{border-color:var(--steel);background:var(--steel-wash)}
.xnav-next{text-align:right}
.xnav-l{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:.32rem}
.xnav-t{display:block;font-family:var(--serif);font-size:1.02rem;color:var(--ink);line-height:1.3}
.xnav:hover .xnav-t{color:var(--steel)}
@media(max-width:640px){.xnavwrap{grid-template-columns:1fr;padding-bottom:2.5rem}.xnav-next{text-align:left}}

/* ===== CASES ===== */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.35rem;margin:2.4rem 0}
.case{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg-card);transition:all .22s}
.case:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--steel)}
.case-img{width:100%;height:230px;object-fit:cover;background:var(--bg-alt);transition:transform .4s}
.case:hover .case-img{transform:scale(1.03)}
.case-b{padding:1.1rem 1.2rem}
.case-t{font-size:.965rem;font-weight:600;margin-bottom:.36rem;line-height:1.34}
.case-d{font-size:.82rem;color:var(--ink-soft);line-height:1.6;margin:0}

/* ===== GLOSSARY ===== */
.gloss{display:grid;gap:1.5rem;margin:2rem 0}
.ggroup{background:var(--bg-card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ggroup-h{background:var(--steel);color:#fff;padding:.78rem 1.15rem;font-size:.755rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.gtable{width:100%;border-collapse:collapse;font-size:.845rem}
.gtable td{padding:.5rem 1.15rem;border-bottom:1px solid var(--line-soft)}
.gtable tr:last-child td{border-bottom:none}
.gtable td:first-child{font-weight:600;width:44%;color:var(--ink)}
.gtable td:last-child{color:var(--ink-soft);font-style:italic}

/* ===== CONTACT ===== */
.contact{background:linear-gradient(135deg,var(--bg-deep) 0%,#1A2028 55%,#20272F 100%);color:#fff;padding:5rem 1.6rem}
.contact-in{max-width:1000px;margin:0 auto}
.contact h2{color:#fff}
.contact-lead{color:rgba(255,255,255,.74);max-width:660px;font-size:1rem;line-height:1.72}
.cinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.13);border-radius:8px;overflow:hidden;margin-top:2.4rem}
.cinfo div{background:rgba(255,255,255,.035);padding:1.3rem 1.2rem}
.cinfo dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5);font-weight:700;margin-bottom:.42rem}
.cinfo dd{font-family:var(--mono);font-size:1rem;color:#fff;letter-spacing:-.01em}
.cinfo a{color:var(--copper-light);text-decoration:none;transition:color .18s}
.cinfo a:hover{color:#fff;text-decoration:underline}

/* ===== PARTNERSHIP PILLS ===== */
.pills{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.5rem 0}
.pill{font-size:.845rem;padding:.52rem 1.05rem;background:var(--bg-card);border:1px solid var(--line);border-radius:20px;color:var(--ink-soft);font-weight:500;transition:all .2s}
.pill:hover{border-color:var(--steel);color:var(--steel);background:var(--steel-wash)}

/* ===== FOOTER / DISCLAIMER ===== */
.disc{background:var(--steel-wash);border-top:1px solid var(--line);padding:2.8rem 1.6rem}
.disc-in{max-width:1160px;margin:0 auto}
.disc-h{font-size:.73rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--steel);margin-bottom:.85rem}
.disc p{font-size:.815rem;color:var(--ink-soft);line-height:1.72;max-width:940px}
.foot{border-top:1px solid var(--line);padding:1.6rem;text-align:center;font-size:.78rem;color:var(--ink-faint)}

/* ===== TOOLS ===== */
.print-btn{position:fixed;right:1.1rem;bottom:1.1rem;z-index:400;background:var(--bg-dark);color:#fff;border:none;padding:.68rem 1.05rem;border-radius:24px;font-size:.775rem;font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.22);display:flex;align-items:center;gap:.44rem;transition:all .2s;font-family:var(--sans)}
.print-btn:hover{background:var(--accent);transform:translateY(-2px)}
.print-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
@media(max-width:640px){.print-btn{right:.8rem;bottom:.8rem;padding:.58rem .9rem;font-size:.72rem}}

/* ===== RESPONSIVE TABLE (first col sticky) ===== */
@media(max-width:640px){
  .sec{padding:3.6rem 1.1rem 3rem}
  .prod{padding:2.6rem 0}
  td.k{position:sticky;left:0;background:var(--bg-card);box-shadow:1px 0 0 var(--line-soft);z-index:1}
  tbody tr:nth-child(even) td.k{background:#FDFDFC}
  .flag-v{font-size:.95rem}
  .cover{min-height:80vh}
}

/* ===== PRINT ===== */
@media print{
  .nav,.print-btn,.case:hover,.card:hover{position:static!important;box-shadow:none!important}
  .nav,.print-btn{display:none!important}
  body{background:#fff;font-size:10.5pt;line-height:1.5}
  .sec{padding:1.2cm 0;max-width:100%;page-break-inside:auto}
  .cover{min-height:auto;padding:2cm 1cm}
  .cover::after{background:rgba(0,0,0,.55)}
  .cover h1{font-size:32pt}
  .prod{page-break-inside:avoid;page-break-after:auto;border-top:1px solid #ccc}
  .tbl-wrap{overflow:visible;page-break-inside:avoid;border:1px solid #ccc}
  table{min-width:0;font-size:8.5pt}
  thead th{background:#1a1a1a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.v{font-size:8.5pt}
  .card,.case,.ggroup,.mcell,.sblock,.flag{page-break-inside:avoid}
  .sec-alt,.stats,.flag-row{background:#f8f8f6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .contact{background:#1a1a1a!important;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cinfo div{background:#1a1a1a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{text-decoration:none}
  .cases{grid-template-columns:1fr 1fr}
}
</style>

    `<thead><tr><th>${esc(T(opts.kTitle)||'Parameter')}</th><th>${esc(T(opts.vTitle)||'Value')}</th>${opts.note?'<th>'+esc(T(opts.nTitle)||'Remarks')+'</th>':''}</tr></thead>`;
  const rows = specs.map(s=>{
    const val = typeof s.v === 'string' ? s.v : T(s.v);
    const isTxt = typeof s.v !== 'string';
    return `<tr><td class="k">${esc(T(s.k))}</td><td class="v${isTxt?' txt':''}">${esc(val)}</td>${opts.note&&s.note?`<td class="n">${esc(T(s.note))}</td>`:''}</tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table>${head}<tbody>${rows}</tbody></table></div>`;
}

function gridTable(t, opts={}){
  if(!t) return '';
  if(!t.rows || !t.rows.length) return '';
  const head = `<thead><tr>${TA(t.head).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>`;
  const rows = t.rows.map(r=>{
    let html=''; let ci=0;
    if(opts.leadBlank && r[0]===''){ html+='<td></td>'; ci=1; }
    for(let i=ci;i<r.length;i++){
      const v=r[i]; const s=typeof v==='string'?v:T(v);
      const cls = i===0&&opts.leadBlank&&r[0]!=='' ? 'k' : (opts.mono&&i===0?'':'');
      html+=`<td class="${cls}">${esc(s)}</td>`;
    }
    return `<tr>${html}</tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table>${head}<tbody>${rows}</tbody></table></div>${t.extra?`<p class="tnote">${esc(T(t.extra))}</p>`:''}`;
}

function keyFlags(ks, c){
  if(!ks || !ks.length) return '';
  const cells = ks.map(s=>{
    const v = typeof s.v==='string'?s.v:T(s.v);
    const isTxt = typeof s.v!=='string';
    return `<div class="flag">
      <div class="flag-k">${esc(T(s.k))}</div>
      <div class="flag-v">${esc(v)}${s.u?`<span class="flag-u">${esc(s.u)}</span>`:''}</div>
      ${s.note?`<div class="flag-n">${esc(T(s.note))}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="prod-flags"><div class="flag-row">${cells}</div></div>`;
}

function list(items, cls='flist'){
  if(!items || !items.length) return '';
  return `<ul class="${cls}">${items.map(i=>`<li>${esc(T(i))}</li>`).join('')}</ul>`;
}

function media(img, cap){
  if(!img) return '';
  return `<figure class="prod-media"><img src="${esc(img)}" alt="" loading="lazy">${cap?`<figcaption class="prod-media-cap">${esc(T(cap))}</figcaption>`:''}</figure>`;
}

function transportBlock(items, un, extra){
  const unBar = un ? `<div class="unbar"><span>UN</span><b>${esc(un.no.replace('UN ',''))}</b><span>·</span><span>Class ${esc(un.class)}</span></div>` : '';
  return `<div class="tblock">
    <div class="tblock-h">${svg('alert','tblock-ico')}<span>${esc(T(COMMON.transport))}</span></div>
    ${list(items,'tlist')}
    ${extra?`<div class="tnote" style="margin-top:.85rem">${esc(T(extra))}</div>`:''}
    ${unBar}
  </div>`;
}
</script>

  const featTitle = p.features ?
    `<h4 style="margin-top:1.8rem;font-size:.775rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">${esc(T(COMMON.features))}</h4>${list(p.features)}` : '';

  /* 旗舰产品的特点已在 featTitle 渲染，此处不再重复 */
  const featList = '';

  /* identity table */
  let identTbl = '';
  if(p.identity){
    const rows = p.identity.rows.map(r=>`<tr><td class="k">${esc(T(r[0]))}</td><td class="v">${esc(r[1])}</td><td class="v txt">${esc(T(r[2]))}</td></tr>`).join('');
    identTbl = `<h4 style="margin-top:1.8rem;font-size:.775rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">${LANG==='en'?'Product identification':'Identificación del producto'}</h4>
      <div class="tbl-wrap"><table><thead><tr>${TA(p.identity.head).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  /* grade table */
  let gradeTbl = '';
  if(p.gradeTable){
    gradeTbl = `<h4 style="margin-top:1.8rem;font-size:.775rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">${esc(T(COMMON.grade))}</h4>` + gridTable(p.gradeTable);
  }

  /* formula */
  let formula = '';
  if(p.processFormula){
    formula = `<div class="sblock"><div class="sblock-h">${esc(T(p.formulaTitle))}</div>${gridTable(p.processFormula)}</div>`;
  }

  /* quality */
  let quality = '';
  if(p.quality){
    const q = p.quality;
    quality = `<div class="sblock">
      <div class="sblock-h">${esc(T(p.qualityTitle))}</div>
      <p style="margin-bottom:1rem">${esc(T(q.standard))}</p>
      ${gridTable({head:q.testHead,rows:q.testRows})}
      <h4 style="margin:1.5rem 0 .7rem;font-size:.855rem">${LANG==='en'?'Daily in-process evaluation criteria':'Criterios de evaluación diaria en proceso'}</h4>
      ${gridTable({head:q.dailyHead,rows:q.dailyRows})}
    </div>`;
  }

  /* energy */
  let energy = '';
  if(p.energy){
    energy = `<div class="sblock"><div class="sblock-h">${esc(T(p.energyTitle))}</div>
      <p style="margin-bottom:.7rem"><b>${LANG==='en'?'Steam':'Vapor'}:</b> ${esc(T(p.energy.steam))}</p>
      <p style="margin-bottom:.7rem"><b>${LANG==='en'?'Water':'Agua'}:</b> ${esc(T(p.energy.water))}</p>
      <p style="margin:0"><b>${LANG==='en'?'Power':'Electricidad'}:</b> ${esc(T(p.energy.power))}</p></div>`;
  }

  /* config / control / safety / staff */
  const blocks = [];
  if(p.config) blocks.push(`<div class="sblock"><div class="sblock-h">${esc(T(p.configTitle))}</div>${list(p.config)}</div>`);
  if(p.control) blocks.push(`<div class="sblock"><div class="sblock-h">${esc(T(p.controlTitle))}</div><p>${esc(T(p.control))}</p></div>`);
  if(p.safety) blocks.push(`<div class="sblock"><div class="sblock-h">${esc(T(p.safetyTitle))}</div>${list(p.safety)}</div>`);
  if(p.staff) blocks.push(`<div class="sblock"><div class="sblock-h">${esc(T(p.staffTitle))}</div>${list(p.staff)}</div>`);
  if(p.construction) blocks.push(`<div class="sblock"><div class="sblock-h">${LANG==='en'?'Construction':'Construcción'}</div><p>${esc(T(p.construction))}</p></div>`);
  if(p.usageNote) blocks.push(`<div class="sblock" style="border-color:var(--copper);border-top-color:var(--copper);background:var(--copper-wash)"><div class="sblock-h">${LANG==='en'?'Usage recommendations':'Recomendaciones de uso'}</div><p style="color:#7A4A1E">${esc(T(p.usageNote))}</p></div>`);
  if(p.handling) blocks.push(`<div class="sblock"><div class="sblock-h">${esc(T(p.handling.title))}</div>${list(p.handling.items)}</div>`);
  if(p.comparison) blocks.push(`<div class="sblock"><div class="sblock-h">${esc(T(p.variantsTitle))}</div>${gridTable(p.comparison)}</div>`);
  if(p.variants) blocks.push(`<div class="sblock"><div class="sblock-h">${esc(T(p.variantsTitle))}</div>${list(p.variants)}</div>`);

  const weightTbl = p.weightTable ?
    `<h4 style="margin-top:1.8rem;font-size:.775rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">${esc(T(p.packingTitle))}</h4>${gridTable(p.weightTable,{leadBlank:true})}` : '';

  const packTbl = p.packingTable ?
    `<h4 style="margin-top:1.8rem;font-size:.775rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">${esc(T(COMMON.packaging))}</h4>${gridTable(p.packingTable)}` : '';

  const useBlock = p.use ?
    `<div class="sblock" style="background:var(--bg-alt);border:none;margin-top:1.8rem"><p>${esc(T(p.use))}</p></div>` : '';

  const note = p.note ? `<p class="tnote" style="margin-top:1.4rem">${esc(T(p.note))}</p>` : '';
  const psn = p.properShipping ? `<p class="tnote">${esc(T(p.properShipping))}</p>` : '';
  const restrict = p.restriction ? `<p class="tnote" style="color:var(--accent)">${esc(T(p.restriction))}</p>` : '';

  /* overview 文本（油气井等概述型产品） */
  const overviewText = p.overview ?
    `<p style="font-size:.9rem;color:var(--ink-soft);line-height:1.72;margin-top:1.5rem">${esc(T(p.overview))}</p>` : '';

  /* 图集 */
  const gallery = (p.gallery && p.gallery.length) ?
    `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.85rem;margin:1.5rem 0">
      ${p.gallery.map(g=>`<img src="${esc(IMG(g))}" alt="" loading="lazy" style="width:100%;height:150px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`).join('')}
    </div>` : '';

  const specsTitle = p.specs ? `<h4 style="margin-top:2rem;font-size:.775rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">${esc(T(COMMON.fullSpecs))}</h4>` : '';

  /* 场景配图：为有 gallery 的产品显示图集 */
  const galleryBlock = (p.gallery && p.gallery.length >= 2) ?
    `<div class="gal">${p.gallery.map((g,i)=>`<img src="${esc(IMG(g))}" alt="" loading="lazy" class="gal-i">`).join('')}</div>` : '';

  const galleryTitle = (p.gallery && p.gallery.length >= 2) ?
    `<h4 style="margin-top:2.4rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--steel);font-weight:700">${LANG==='en'?'Related views':'Vistas relacionadas'}</h4>` : '';

  /* 相邻产品缩略图导航 */
  const related = (() => {
    const sibs = allProducts.filter(x=>!p.isOverview);
    const idx = sibs.findIndex(x=>x.id===p.id);
    if(idx<0) return '';
    const prev = sibs[idx-1], next = sibs[idx+1];
    const mk = (x,dir)=> x ? `<a class="rel rel-${dir}" href="#p-${esc(x.id)}">
        <span class="rel-l">${LANG==='en'?(dir==='prev'?'Previous':'Next'):(dir==='prev'?'Anterior':'Siguiente')}</span>
        <span class="rel-t">${esc(T(x.name))}</span></a>` : '<span></span>';
    return `<nav class="relnav">${mk(prev,'prev')}${mk(next,'next')}</nav>`;
  })();

  return `<article class="prod" id="p-${esc(p.id)}">
    <div class="prod-head">
      <div>
        <h3 class="prod-name">${esc(T(p.name))}${p.full?`<span class="prod-full">${esc(T(p.full))}</span>`:''}${p.formula?`<span class="prod-formula">${esc(p.formula)}</span>`:''}</h3>
        <p class="prod-tag">${esc(T(p.tagline))}</p>
        <div class="badges">${badges.join('')}</div>
      </div>
    </div>
    ${media(IMG(p.image))}
    ${overviewText}
    ${p.intro?`<p style="font-size:.9rem;color:var(--ink-soft);line-height:1.72;margin-top:1.5rem">${esc(T(p.intro))}</p>`:''}
    ${gallery}
    ${keyFlags(p.keySpecs)}
    ${appTitle}
    ${useBlock}
    ${compTitle}
    ${featTitle}
    ${identTbl}
    ${gradeTbl}
    ${specsTitle}${specTable(p.specs,{note:true})}
    ${featList}
    ${formula}
    ${quality}
    ${energy}
    ${blocks.join('')}
    ${packTbl}
    ${weightTbl}
    ${packTbl?'':(p.packing?`<div class="sblock"><div class="sblock-h">${esc(T(COMMON.packagingNote))}</div><p>${esc(T(p.packing))}</p></div>`:'')}
    ${transportBlock(p.transport, p.un, p.restriction)}
    ${psn}${note}
    ${galleryTitle}${galleryBlock}
    ${related}
  </article>`;
}

/* --- 章节 --- */
function renderChapter(c){
  const notice = c.notice ?
    `<div class="notice">${svg('info','notice-ico')}<div><b>${LANG==='en'?'Controlled goods:':'Bienes controlados:'}</b> ${esc(T(c.notice))}</div></div>` : '';
  const series = c.seriesNote ?
    `<div class="series-note">${svg('info','sn-ico')}<p>${esc(T(c.seriesNote))}</p></div>` : '';
  // 章节页（内页头已显示标题）且只有 1 个产品时，不再重复大标题
  const isChapterPage = mode === 'chapter';
  const showHead = !(isChapterPage && c.products.length <= 1);
  return `<section class="sec" id="${c.id}">
    ${showHead ? `<div class="sec-head">
      <div class="sec-num">${esc(c.num)}</div>
      <p class="sec-eyebrow">${esc(T(c.eyebrow))}</p>
      <h2 class="sec-title">${esc(T(c.title))}</h2>
      <p class="sec-lead">${esc(T(c.lead))}</p>
    </div>` : ''}
    ${notice}${series}
    ${c.products.map(renderProduct).join('')}
  </section>`;
}


/* --- 主页：各章摘要卡（带代表图 + 跳转链接）--- */
function renderChapterIndex(){
  const links = (PAGE && PAGE.chapterLinks) || {};
  return `<section class="sec sec-alt" id="chapters">
    <div class="sec-head">
      <p class="sec-eyebrow">${esc(T({en:'Product Chapters',es:'Capítulos de Productos'}))}</p>
      <h2 class="sec-title">${esc(T({en:'Browse by product family',es:'Ver por familia de productos'}))}</h2>
      <p class="sec-lead">${esc(T({en:'Each product family is presented on its own page, so you can go straight to the specifications you need without scrolling through the whole catalog.',es:'Cada familia de productos se presenta en su propia página, para que pueda ir directamente a las especificaciones que necesita sin recorrer todo el catálogo.'}))}</p>
    </div>
    <div class="chgrid">${chapters.map(c=>{
      const href = links[c.id] || ('#'+c.id);
      const rep = c.products.find(p=>!p.isOverview) || c.products[0];
      const key = rep.keySpecs && rep.keySpecs[0] ? T(rep.keySpecs[0].k) : '';
      return `<a class="chcard" href="${esc(href)}">
        <div class="chcard-img"><img src="${esc(IMG(rep.image))}" alt="" loading="lazy"></div>
        <div class="chcard-b">
          <div class="chcard-n">${esc(c.num)}</div>
          <h3 class="chcard-t">${esc(T(c.title))}</h3>
          <p class="chcard-d">${c.products.length} ${LANG==='en'?'references':'referencias'}${key?' &nbsp;·&nbsp; '+esc(key):''}</p>
          <span class="chcard-go">${LANG==='en'?'Open chapter':'Abrir capítulo'} &rarr;</span>
        </div>
      </a>`;
    }).join('')}</div>
  </section>`;
}

/* --- 章节页：上一章 / 下一章 --- */
function renderCrossChapterNav(curId){
  const links = (PAGE && PAGE.chapterLinks) || {};
  const idx = chapters.findIndex(c=>c.id===curId);
  const prev = idx>0 ? chapters[idx-1] : null;
  const next = idx<chapters.length-1 ? chapters[idx+1] : null;
  const homeHref = (PAGE && PAGE.homeLink) || '#top';
  const mk = (c,dir)=> c
    ? `<a class="xnav xnav-${dir}" href="${esc(links[c.id]||('#'+c.id))}">
         <span class="xnav-l">${LANG==='en'?(dir==='prev'?'Previous chapter':'Next chapter'):(dir==='prev'?'Capítulo anterior':'Capítulo siguiente')}</span>
         <span class="xnav-t">${esc(c.num)} &nbsp;${esc(T(c.title))}</span></a>`
    : `<a class="xnav xnav-${dir}" href="${esc(homeHref)}">
         <span class="xnav-l">${LANG==='en'?'Back to':'Volver a'}</span>
         <span class="xnav-t">${LANG==='en'?'Catalog Home':'Portada'}</span></a>`;
  return `<nav class="xnavwrap">${mk(prev,'prev')}${mk(next,'next')}</nav>`;
}

/* --- 案例 --- */
function renderCases(){
  const c = CASES;
  return `<section class="sec sec-alt" id="cases">
    <div class="sec-head">
      <p class="sec-eyebrow">${esc(T(c.eyebrow))}</p>
      <h2 class="sec-title">${esc(T(c.title))}</h2>
      <p class="sec-lead">${esc(T(c.lead))}</p>
    </div>
    <div class="cases">${c.items.map(i=>`
      <figure class="case">
        <img class="case-img" src="${esc(IMG(i.img))}" alt="${esc(T(i.t))}" loading="lazy">
        <figcaption class="case-b">
          <h3 class="case-t">${esc(T(i.t))}</h3>
          <p class="case-d">${esc(T(i.d))}</p>
        </figcaption>
      </figure>`).join('')}</div>
  </section>`;
}

/* --- 服务 --- */
function renderService(){
  const s = SERVICE;
  return `<section class="sec" id="service">
    <div class="sec-head">
      <p class="sec-eyebrow">${esc(T(s.eyebrow))}</p>
      <h2 class="sec-title">${esc(T(s.title))}</h2>
      <p class="sec-lead">${esc(T(s.lead))}</p>
    </div>
    <div class="cards">${s.items.map(x=>`
      <article class="card">${svg(x.icon)}<h3>${esc(T(x.t))}</h3><p>${esc(T(x.d))}</p></article>`).join('')}</div>
    <h3 style="font-family:var(--serif);font-size:1.22rem;font-weight:400;margin:2.6rem 0 .5rem">${esc(T(s.partnershipTitle))}</h3>
    <div class="pills">${s.partnerships.map(p=>`<span class="pill">${esc(T(p))}</span>`).join('')}</div>
  </section>`;
}

/* --- 附录：UN 汇总 + 术语 --- */
function renderAppendix(){
  const a = APPENDIX, g = GLOSSARY;
  const unRows = allProducts.filter(p=>p.un).map(p=>`<tr><td class="k">${esc(T(p.name))}</td><td class="v">${esc(p.un.no)}</td><td class="v">${esc(p.un.class)}</td></tr>`).join('');
  return `<section class="sec sec-alt" id="glossary">
    <div class="sec-head">
      <p class="sec-eyebrow">${esc(T(a.eyebrow))}</p>
      <h2 class="sec-title">${esc(T(a.title))}</h2>
    </div>
    <h3 style="font-family:var(--serif);font-size:1.22rem;font-weight:400;margin-bottom:.5rem">${esc(T(a.unTitle))}</h3>
    <p class="tnote" style="margin-bottom:1.1rem">${esc(T(a.unNote))}</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>${esc(T(COMMON.parameter))}</th><th>${esc(T(COMMON.unNo))}</th><th>${esc(T(COMMON.unClass))}</th></tr></thead>
      <tbody>${unRows}</tbody>
    </table></div>
    <h3 style="font-family:var(--serif);font-size:1.22rem;font-weight:400;margin:3rem 0 .5rem">${esc(T(g.title))}</h3>
    <p class="sec-lead" style="font-size:.95rem;margin-bottom:1.6rem">${esc(T(g.lead))}</p>
    <div class="gloss">${g.groups.map(gr=>`
      <div class="ggroup">
        <div class="ggroup-h">${esc(T(gr.title))}</div>
        <table class="gtable"><tbody>${gr.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>
      </div>`).join('')}</div>
  </section>`;
}

/* --- 联系 --- */
function renderContact(){
  const c = CONTACT;
  document.getElementById('contact').innerHTML = `
    <div class="contact-in">
      <p class="sec-eyebrow" style="color:var(--accent-light)">${esc(T(c.eyebrow))}</p>
      <h2 class="sec-title">${esc(T(c.title))}</h2>
      <p class="contact-lead">${esc(T(c.lead))}</p>
      <dl class="cinfo">${c.items.map(i=>`
        <div><dt>${esc(T(i.k))}</dt><dd>${i.href?`<a href="${esc(i.href)}">${esc(i.v)}</a>`:esc(i.v)}</dd></div>`).join('')}</dl>
    </div>`;
}

/* ---------- 组装：按页面模式 ---------- */
let html = '';

if(mode === 'full'){
  html = renderAbout() + renderOverview() +
         chapters.map(renderChapter).join('') +
         renderCases() + renderService() + renderAppendix();
} else if(mode === 'home'){
  // 主页：公司介绍 + 产品总览（各章摘要卡）+ 服务 + 联系
  html = renderAbout() + renderOverview() + renderChapterIndex() + renderService();
} else if(mode === 'chapter'){
  // 章节页：仅该章 + 上下章导航
  const ch = chapters.find(c => c.id === PAGE.chapter);
  html = renderChapter(ch) + renderCrossChapterNav(PAGE.chapter);
} else if(mode === 'cases'){
  html = renderCases();
} else if(mode === 'appendix'){
  html = renderService() + renderAppendix();
}

document.getElementById('app').innerHTML = html;
if(mode !== 'chapter') renderContact();

/* 页面切换条注入 */
if(PAGE && PAGE.pagenav){
  const el = document.getElementById('pagenav');
  if(el) el.outerHTML = PAGE.pagenav;
}
</script>
<script>
(function(){
  function addLangSwitch(){
    var navLinks = document.getElementById('navLinks');
    if (!navLinks) return false;
    // Don't add duplicates
    if (navLinks.querySelector('.nav-lang')) return true;
    var path = location.pathname;
    var file = path.split('/').pop() || 'index.html';
    var isEs = path.indexOf('/es/') >= 0;
    var a = document.createElement('a');
    a.className = 'nav-lang';
    a.href = isEs ? file : ('/es/' + file);
    a.lang = isEs ? 'en' : 'es';
    a.textContent = isEs ? 'EN' : 'ES';
    a.title = isEs ? 'English' : 'Español';
    a.setAttribute('aria-label', isEs ? 'Switch to English' : 'Cambiar a Español');
    navLinks.appendChild(a);
    return true;
  }
  function tryAdd(){
    if (addLangSwitch()) return true;
    return false;
  }
  // Try on DOMContentLoaded
  function onReady(){
    // Try a few times to handle v3's async nav population
    var tries = 0;
    function attempt(){
      tries++;
      if (tryAdd()) return;
      if (tries < 20) setTimeout(attempt, 100);
    }
    attempt();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', onReady);
  } else {
    onReady();
  }
  // Also use MutationObserver: if navLinks gets cleared, re-add
  var observer = new MutationObserver(function(mutations){
    for (var i = 0; i < mutations.length; i++){
      var m = mutations[i];
      // If navLinks children were removed (innerHTML reset)
      if (m.removedNodes && m.removedNodes.length > 0) {
        // Wait a tick then re-add
        setTimeout(tryAdd, 10);
        break;
      }
    }
  });
  // Start observing once navLinks exists
  function startObserving(){
    var navLinks = document.getElementById('navLinks');
    if (navLinks) {
      observer.observe(navLinks, { childList: true, subtree: false });
    } else {
      setTimeout(startObserving, 100);
    }
  }
  startObserving();
})();
</script>
</body>
